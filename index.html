<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Gastos</title>
    <link rel="stylesheet" href="assets/css/index.css">
    <!-- CDN para las gráficas con Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <main class="container">
        <h1>Control de Gastos Diarios</h1>

        <!-- Límite de gasto (P3 - EXTRA) -->
        <div class="form-group">
            <label for="limit">Límite de gasto ($):</label>
            <input type="number" id="limit" step="0.01" min="0" placeholder="Ej: 2000">
            <button type="button" id="set-limit-btn">Guardar Límite</button>
            <p id="limit-status"></p>
        </div>

        <!-- Formulario para ingresar gastos (P2 - Tarea 2, + categoría y fecha P3) -->
        <form id="expense-form">
            <div class="form-group">
                <label for="description">Concepto:</label>
                <input type="text" id="description" placeholder="Ej: Café, Transporte..." required>
            </div>
            <div class="form-group">
                <label for="amount">Monto ($):</label>
                <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
            </div>
            <div class="form-group">
                <label for="category">Categoría:</label>
                <select id="category" required>
                    <option value="" disabled selected>Selecciona categoría</option>
                    <option value="Comida">🍔 Comida</option>
                    <option value="Transporte">🚌 Transporte</option>
                    <option value="Entretenimiento">🎮 Entretenimiento</option>
                    <option value="Servicios">💡 Servicios</option>
                    <option value="Salud">💊 Salud</option>
                    <option value="Otros">📦 Otros</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Fecha:</label>
                <input type="date" id="date" required>
            </div>
            <button type="submit">Agregar Gasto</button>
        </form>

        <!-- Lista de gastos registrados -->
        <section class="list-section">
            <h2>Gastos Registrados</h2>
            <div class="filter-buttons">
                <button type="button" class="filter-button" data-filter="today">Hoy</button>
                <button type="button" class="filter-button active" data-filter="week">Esta semana</button>
                <button type="button" class="filter-button" data-filter="month">Este mes</button>
            </div>
            <ul id="expense-list"></ul>
        </section>

        <!-- Resumen Gráfico (P2 - Tarea 4) -->
        <section class="chart-section">
            <h2>Resumen Gráfico</h2>
            <div class="chart-container">
                <canvas id="expense-chart"></canvas>
            </div>
        </section>
    </main>

    <script src="assets/js/incex.js"></script>
</body>
</html>
